# minesweeper.org-vhost.conf — Apache changes for zero-downtime deploys (F-ZERO-DOWNTIME).
# NOT a complete vhost. Apply by hand to the minesweeper.org <VirtualHost *:443> in
# /etc/apache2/sites-enabled/default-ssl.conf during the cutover
# (docs/zero-downtime-deploy-runbook.md). Modules, once:
#   sudo a2enmod proxy_balancer lbmethod_byrequests slotmem_shm

# ── 1. Uploads come from the shared folder ───────────────────────────────────
# Put these BEFORE the existing "Alias /static /home/ubuntu/minesweeper/static":
# Apache uses the first Alias that matches.
Alias /static/uploads /home/ubuntu/minesweeper-shared/uploads
<Directory /home/ubuntu/minesweeper-shared/uploads>
    Require all granted
    Header set Cache-Control "max-age=31536000, public, immutable"
</Directory>

# The existing static alias stays as it is; /home/ubuntu/minesweeper is now a
# symlink to the live copy:
#   Alias /static /home/ubuntu/minesweeper/static

# ── 2. The PvP routes stay exactly as they are (port 8050) ───────────────────
#   ProxyPass /ws/ ws://127.0.0.1:8050/ws/ upgrade=websocket retry=0   … /duel, /duelold, /pvp, /pvpbeta

# ── 3. Replace the catch-all ──────────────────────────────────────────────────
# Remove:
#   ProxyPass        / http://127.0.0.1:8000/
#   ProxyPassReverse / http://127.0.0.1:8000/
# Add (keep it AFTER the PvP ProxyPass lines — Apache uses the first match):
<Proxy "balancer://minesweeper_web">
    # Both copies are members; normally only one is running. A refused connection
    # puts that member in error for 5 s and the request goes to the other one.
    # disablereuse: never send a request on a pooled connection the stopping copy
    # may have closed (a POST on one would come back as a 502).
    BalancerMember "http://127.0.0.1:8010" retry=5 disablereuse=On
    BalancerMember "http://127.0.0.1:8011" retry=5 disablereuse=On
    ProxySet lbmethod=byrequests
</Proxy>
ProxyPass        / balancer://minesweeper_web/
ProxyPassReverse / balancer://minesweeper_web/
