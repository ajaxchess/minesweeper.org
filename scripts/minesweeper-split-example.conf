# Example vhost for the web/pvp process split — NOT wired into install_ubuntu.sh
# or any live config yet. Adapt into /etc/apache2/sites-available/minesweeper.org.conf
# (and staging-minesweeper.conf) once minesweeper-web.service and
# minesweeper-pvp.service are both deployed and running.
#
# Routing rule: anything backed by duel.py's in-memory game/matchmaking state
# (/duel, /duelold, /pvp, /pvpbeta, /ws/) MUST go to the single-worker pvp
# instance (8050). Everything else scales across the web pool (8000).
#
# Apache matches ProxyPass directives in the order they're declared — the
# more specific paths below MUST come before the catch-all "/".

<VirtualHost *:80>
    ServerName minesweeper.org
    ServerAlias www.minesweeper.org

    ProxyPreserveHost On
    ProxyPass        /static/ !
    Alias /static /home/ubuntu/minesweeper/static
    <Directory /home/ubuntu/minesweeper/static>
        Require all granted
        Header set Cache-Control "max-age=31536000, public, immutable"
    </Directory>

    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json text/plain

    # ── PVP / duel — pinned to the single-worker instance (in-memory state) ──
    ProxyPass        /ws/       ws://127.0.0.1:8050/ws/      upgrade=websocket retry=0
    ProxyPassReverse /ws/       ws://127.0.0.1:8050/ws/

    ProxyPass        /duel      http://127.0.0.1:8050/duel    retry=0
    ProxyPassReverse /duel      http://127.0.0.1:8050/duel

    ProxyPass        /duelold   http://127.0.0.1:8050/duelold retry=0
    ProxyPassReverse /duelold   http://127.0.0.1:8050/duelold

    ProxyPass        /pvp       http://127.0.0.1:8050/pvp     retry=0
    ProxyPassReverse /pvp       http://127.0.0.1:8050/pvp

    ProxyPass        /pvpbeta   http://127.0.0.1:8050/pvpbeta retry=0
    ProxyPassReverse /pvpbeta   http://127.0.0.1:8050/pvpbeta

    # ── Everything else — scaled across the gunicorn worker pool ────────────
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog  ${APACHE_LOG_DIR}/minesweeper.org-error.log
    CustomLog ${APACHE_LOG_DIR}/minesweeper.org-access.log combined
</VirtualHost>
