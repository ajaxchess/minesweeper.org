# /etc/apache2/sites-available/staging.minesweeper.org-le-ssl.conf
#
# When uvicorn is stopped, ProxyErrorOverride On lets Apache intercept the 503
# connection-refused error.  ErrorDocument 503 with a full URL issues a 302
# redirect to production so visitors land on minesweeper.org instead of a raw
# Apache error page. This applies vhost-wide, so it covers both backends below.
#
# Staging mirrors production's web/pvp split (see
# scripts/minesweeper-staging-web.service / scripts/minesweeper-staging-pvp.service
# and docs/pvp-gunicorn-split-runbook.md): /duel, /duelold, /pvp, /pvpbeta,
# /ws/ go to the single-worker pvp instance (8052); everything else to the
# web instance (8002). Both are started/stopped together by
# scripts/staging_minesweeper_service_update_and_restart.sh.
#
# To apply on the server:
#   sudo cp scripts/staging-minesweeper.conf \
#       /etc/apache2/sites-available/staging.minesweeper.org-le-ssl.conf
#   sudo systemctl reload apache2

<VirtualHost *:443>
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
  ServerAdmin minesweeper@gmail.com
  ServerName staging.minesweeper.org

  ProxyPreserveHost On

  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Host  "%{HTTP_HOST}s"

  # NEW: when uvicorn is down, redirect to production instead of showing an error
  ProxyErrorOverride On
  ErrorDocument 503 https://minesweeper.org

  # Cache static assets for 1 year (content-versioned via ?v= query params)
  <LocationMatch "^/static/">
    Header set Cache-Control "max-age=31536000, public, immutable"
  </LocationMatch>

  # Compress text responses
  AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json text/plain

  # PVP / duel — pinned to the single-worker pvp instance (in-memory game +
  # matchmaking state in duel.py). Apache matches ProxyPass in declaration
  # order, so these specific paths must come before the catch-all "/" below.
  ProxyPass /ws/ ws://127.0.0.1:8052/ws/ upgrade=websocket retry=0
  ProxyPassReverse /ws/ ws://127.0.0.1:8052/ws/

  ProxyPass /duel http://127.0.0.1:8052/duel retry=0
  ProxyPassReverse /duel http://127.0.0.1:8052/duel

  ProxyPass /duelold http://127.0.0.1:8052/duelold retry=0
  ProxyPassReverse /duelold http://127.0.0.1:8052/duelold

  ProxyPass /pvp http://127.0.0.1:8052/pvp retry=0
  ProxyPassReverse /pvp http://127.0.0.1:8052/pvp

  ProxyPass /pvpbeta http://127.0.0.1:8052/pvpbeta retry=0
  ProxyPassReverse /pvpbeta http://127.0.0.1:8052/pvpbeta

  # Everything else — the general web instance
  ProxyPass / http://127.0.0.1:8002/ retry=0
  ProxyPassReverse / http://127.0.0.1:8002/

  <Directory />
    Options FollowSymLinks
    AllowOverride All
  </Directory>
  <Directory /var/www/>
    Options Indexes FollowSymLinks MultiViews
    AllowOverride All
    Order allow,deny
    allow from all
  </Directory>

  Include /etc/letsencrypt/options-ssl-apache.conf
  ServerAlias staging.minesweeper.org
  SSLCertificateFile /etc/letsencrypt/live/staging.minesweeper.org/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/staging.minesweeper.org/privkey.pem

  ErrorLog  ${APACHE_LOG_DIR}/staging.minesweeper.org-ssl-error.log
  CustomLog ${APACHE_LOG_DIR}/staging.minesweeper.org-ssl-access.log combined
</VirtualHost>
