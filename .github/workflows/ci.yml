name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.in

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.in

      - name: Run pytest
        run: pytest tests/ -v --tb=short

      - name: Install Bandit
        run: pip install "bandit[toml]==1.9.4"

      - name: Run Bandit (SAST)
        run: |
          bandit -r . \
            --exclude ./venv,./tests,./analysis,./python_prototypes \
            --severity-level medium \
            --confidence-level medium \
            -f txt

  # Expo apps: fail when a dependency doesn't match the app's Expo SDK
  # (Dependabot bumps passed CI before because nothing checked this).
  mobile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: msmobile
            node: "20"
            jest: true
          - app: nmmobile
            node: "22"   # Expo SDK 58 needs Node 22.13+
            jest: false
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mobile/${{ matrix.app }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Expo SDK version check
        run: npx expo install --check
        env:
          CI: "1"

      - name: Jest
        if: ${{ matrix.jest }}
        run: npx jest --ci
