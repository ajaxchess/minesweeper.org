name: Build Assets

# Minified output in static/js/ and static/css/ is BUILT from static/src/.
# Edit static/src/js/*.js and static/src/css/*.css — never the served copies,
# which this workflow overwrites. See intent/StaticAssetSourceOfTruth.md.
on:
  push:
    branches: ["main"]
    paths:
      - "static/src/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build tools
        run: npm install -g terser csso-cli

      - name: Minify JS
        run: |
          set -euo pipefail
          for f in static/src/js/*.js; do
            [ -e "$f" ] || continue
            out="static/js/$(basename "$f")"
            terser "$f" --compress --mangle --output "$out"
            echo "  $f -> $out"
          done

      - name: Minify CSS
        run: |
          set -euo pipefail
          for f in static/src/css/*.css; do
            [ -e "$f" ] || continue
            out="static/css/$(basename "$f")"
            csso "$f" --output "$out"
            echo "  $f -> $out"
          done

      - name: Commit built assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/js/*.js static/css/*.css
          if git diff --staged --quiet; then
            echo "No changes — assets already up to date."
          else
            git commit -m "chore: build static assets [skip ci]"
            git push
          fi
