# Dependabot version updates. Options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Known accepted advisories and npm override rules: docs/security/dependency-risk-register.md

version: 2
updates:
  # Python web app. Dependabot only bumps requirements.txt — regenerate
  # requirements.lock before merging (tests/test_requirements_sync.py fails until you do).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps):"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Minesweeper mobile app (Expo). Expo SDK and React Native majors move
  # together and need a manual SDK upgrade, so only minor/patch PRs here.
  - package-ecosystem: "npm"
    directory: "/mobile/msmobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-msmobile):"
    groups:
      msmobile-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Numbers Match mobile app. Stays on its Expo canary build for now
  # (decision 2026-10-11), so Expo packages are not updated here.
  - package-ecosystem: "npm"
    directory: "/mobile/nmmobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-nmmobile):"
    groups:
      nmmobile-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
